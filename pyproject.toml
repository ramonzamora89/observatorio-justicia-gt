[project]
name = "observatorio-justicia-gt"
version = "0.1.0"
description = "Observatorio de Resoluciones Judiciales de Guatemala — adquisición reproducible y auditable"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "structlog>=24.1",
    "typer>=0.12",
    "anthropic>=0.69",
    "duckdb>=1.5.5",
]

[project.scripts]
obsgt = "observatorio_gt.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
    "pillow>=12.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/observatorio_gt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network and not ocr' -q"
markers = [
    "network: toca la red de verdad; deseleccionado por defecto",
    "ocr: ejecuta OCR real; lento y necesita ocrmypdf/tesseract-spa",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# typer declara sus opciones como defaults de argumento; es su API.
"src/observatorio_gt/cli.py" = ["B008"]

[[tool.mypy.overrides]]
module = ["anthropic.*"]
ignore_missing_imports = true

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["observatorio_gt"]
